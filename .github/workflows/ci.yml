name: Monorepo CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  contracts-checks:
    name: Soroban Smart Contracts Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Verify Contract Formatting
        run: |
          cd contracts
          cargo fmt --check

      - name: Run Cargo Check
        run: |
          cd contracts
          cargo check

      - name: Run Clippy Linter
        run: |
          cd contracts
          cargo clippy --all-targets -- -D warnings

      - name: Run Contract Unit & Lifecycle Tests
        run: |
          cd contracts
          cargo test

      - name: Build Contract WASM
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release

  contract-client-checks:
    name: TypeScript Contract Client SDK Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install SDK Dependencies
        run: |
          cd packages/contract-client
          npm ci

      - name: Run SDK Typecheck
        run: |
          cd packages/contract-client
          npm run typecheck

      - name: Run SDK Unit Tests
        run: |
          cd packages/contract-client
          npm run test

      - name: Build SDK
        run: |
          cd packages/contract-client
          npm run build

  web-frontend-checks:
    name: Next.js Web Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint Verification
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript Typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Web Unit Tests
        run: |
          cd apps/web
          npm run test

      - name: Production Next.js Build
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CBIHLECKLMXYK6FPHSGGVYF6AHNFRHR3T5EIFIS3PFQDFKDQWNR25PHT
        run: |
          cd apps/web
          npm run build

  go-relay-checks:
    name: Go Relay Service Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: services/relay/go.sum

      - name: Verify Go Formatting
        run: |
          cd services/relay
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd services/relay
          go vet ./...

      - name: Run Go Tests & Race Detector
        run: |
          cd services/relay
          go test -v -race ./...

      - name: Build Relay Daemon Executable
        run: |
          cd services/relay
          go build ./cmd/relay/main.go

  web-e2e-tests:
    name: Next.js Web End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd apps/web
          npx playwright install chromium --with-deps

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CBIHLECKLMXYK6FPHSGGVYF6AHNFRHR3T5EIFIS3PFQDFKDQWNR25PHT
        run: |
          cd apps/web
          npm run build

      - name: Start Next.js Server and Run Playwright Tests
        run: |
          cd apps/web
          npm start > /tmp/nextjs-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js server is ready"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
            echo "Next.js server did not become ready" >&2
            cat /tmp/nextjs-server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          npx playwright test
          TEST_EXIT=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$TEST_EXIT"
