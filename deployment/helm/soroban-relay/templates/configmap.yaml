{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soroban-relay.fullname" . }}-config
  labels:
    {{- include "soroban-relay.labels" . | nindent 4 }}
  {{- with .Values.configmap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.configmap.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{ toYaml .Values.configmap.data | indent 2 }}
{{- end }}
