apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soroban-relay.fullname" . }}
  labels:
    {{- include "soroban-relay.labels" . | nindent 4 }}
  {{- with .Values.global.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.strategy }}
  strategy: {{ toYaml . | nindent 4 }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "soroban-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "soroban-relay.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.global.name }}
      namespace: {{ . }}
      {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: relay-state
          persistentVolumeClaim:
            claimName: {{ include "soroban-relay.fullname" . }}-pvc
        {{- end }}
        {{- if .Values.configmap.enabled }}
        - name: relay-config
          configMap:
            name: {{ include "soroban-relay.fullname" . }}-config
        {{- end }}
      containers:
        - name: {{ include "soroban-relay.name" . }}
          image: {{ include "soroban-relay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe: {{ toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- end }}
              {{- if .valueFrom }}
              valueFrom: {{ toYaml .valueFrom | nindent 14 }}
              {{- end }}
            {{- end }}
          envFrom:
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: relay-state
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.configmap.enabled }}
            - name: relay-config
              mountPath: /etc/soroban-relay
              readOnly: true
            {{- end }}