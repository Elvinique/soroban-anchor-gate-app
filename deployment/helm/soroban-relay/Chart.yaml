apiVersion: v2
name: soroban-relay
description: |
  Helm chart for deploying the Soroban Anchor Gate relay daemon.
  The relay bridges Stellar Soroban smart contract events (escrow Funded,
  Disbursed, Disputed) to external anchor banking endpoints via authenticated
  HMAC-SHA256 webhooks with exponential backoff retry and dead-lettering.
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - soroban
  - stellar
  - anchor
  - relay
  - webhook
home: https://github.com/Sorobo-Gate/soroban-anchor-gate-app
sources:
  - https://github.com/Sorobo-Gate/soroban-anchor-gate-app
maintainers:
  - name: Sorobo-Gate Maintainers
    url: https://github.com/Sorobo-Gate/soroban-anchor-gate-app
